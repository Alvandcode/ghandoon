name: qand_app
description: اپ قنادی قند - سفارش کیک خونگی، کوکی، بیسکوییت و کیک تولد
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  supabase_flutter: ^2.5.0
  image_picker: ^1.0.7
  url_launcher: ^6.2.5
  shared_preferences: ^2.2.2
  shamsi_date: ^1.0.0
  cached_network_image: ^3.3.1
  flutter_local_notifications: ^22.3.1
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo/logo.png"
  adaptive_icon_background: "#F02010"
  adaptive_icon_foreground: "assets/logo/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/logo/

  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn.ttf
    # تیتر وینتیج: بهمن (ذخیره لاله‌زار)
    - family: Bahman
      fonts:
        - asset: assets/fonts/bahman.ttf
    - family: Lalezar
      fonts:
        - asset: assets/fonts/Lalezar.ttf
    # متن (نسخ/کتیبه)
    - family: Katibeh
      fonts:
        - asset: assets/fonts/Katibeh.ttf
