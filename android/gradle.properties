org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# enableJetifier حذف شد — همه وابستگی‌ها AndroidX هستند و jetifier فقط بیلد را کند می‌کند
# برای اینکه بیلد ریلیز با R8 کوچک شود ولی نمادهای فلاتر حفظ شوند
android.enableR8.fullMode=false
# سازگاری با پلاگین فلاتر (local.properties توسط flutter tool ساخته می‌شود)
