plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

// امضای ریلیز:
// 1) اگر android/key.properties موجود باشد (بیلد محلی یا CI) از آن استفاده می‌شود.
// 2) در نبود آن، بیلد release با کلید دیباگ امضا می‌شود (نصب مستقیم OK، انتشار استور نه)
//    و یک هشدار واضح در لاگ بیلد چاپ می‌شود.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
def hasKeystoreFile = keystorePropertiesFile.exists()
if (hasKeystoreFile) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace = "com.qand.app"
    compileSdk = 35
    ndkVersion = "25.1.8937393"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    defaultConfig {
        applicationId = "com.qand.app"
        // اندروید 7 (API 24) تا اندروید 15 (API 35) : min 24 ، target 35
        minSdk = 24
        targetSdk = 35
        versionCode = 1
        versionName = "1.0.0"
        multiDexEnabled = true
    }

    signingConfigs {
        if (hasKeystoreFile) {
            release {
                storeFile = file(keystoreProperties['storeFile'])
                storePassword = keystoreProperties['storePassword']
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            if (hasKeystoreFile) {
                signingConfig = signingConfigs.release
            } else {
                // هشدار: بدون keystore واقعی، با کلید دیباگ امضا می‌شود.
                println("WARNING: android/key.properties not found -> release APK will be signed with the DEBUG key (not store-ready).")
                signingConfig = signingConfigs.debug
            }
            // کوچک‌سازی و بهینه‌سازی بیلد ریلیز
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source = "../.."
}