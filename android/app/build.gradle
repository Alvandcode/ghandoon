plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.qand.app"
    compileSdk = 35
    ndkVersion = "25.1.8937393"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    defaultConfig {
        applicationId = "com.qand.app"
        // اندروید 7 (API 24) تا اندروید 15 (API 35) : min 24 ، target 35
        minSdk = 24
        targetSdk = 35
        versionCode = 1
        versionName = "1.0.0"
        multiDexEnabled = true
    }

    buildTypes {
        release {
            // پیش‌فرض CI: با کلید دیباگ امضا کن تا بیلد نخوابد.
            // برای انتشار واقعی: android/key.properties.example را به key.properties کپی کنید.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}