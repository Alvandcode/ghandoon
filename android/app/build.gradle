plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.qand.app"
    compileSdk = 35
    ndkVersion = "25.1.8937393"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    defaultConfig {
        applicationId = "com.qand.app"
        // اندروید 7 (API 24) تا اندروید 15 (API 35) : min 24 ، target 35
        minSdk = 24
        targetSdk = 35
        versionCode = 1
        versionName = "1.0.0"
        multiDexEnabled = true
    }

    signingConfigs {
        // اگر فایل key.properties کنار این build.gradle باشد (بیلد محلی ریلیز)،
        // از کی‌استور واقعی استفاده می‌شود. نمونه: key.properties.example
        release {
            def keystorePropertiesFile = rootProject.file("key.properties")
            if (keystorePropertiesFile.exists()) {
                def keystoreProperties = new Properties()
                keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // پیش‌فرض CI: اگر key.properties نبود، با کلید دیباگ امضا کن تا بیلد نخوابد.
            // فایل key.properties در .gitignore است و هرگز کامیت نمی‌شود.
            try {
                signingConfig = signingConfigs.release.storeFile != null ? signingConfigs.release : signingConfigs.debug
            } catch (Exception ignored) {
                signingConfig = signingConfigs.debug
            }
        }
    }
}

flutter {
    source = "../.."
}
