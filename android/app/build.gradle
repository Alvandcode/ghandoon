plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

// پلاگین گوگل فقط وقتی فعال می‌شود که google-services.json واقعاً هست.
// (بیلد ابری CI آن فایل را ندارد و نباید بشکند؛ در آن حالت پوش FCM
// در ران‌تایم غیرفعال می‌ماند و اپ با اعلان محلی کار می‌کند.)
if (file("google-services.json").exists()) {
    apply plugin: "com.google.gms.google-services"
}

// امضای ریلیز:
// 1) اگر android/key.properties موجود باشد (بیلد محلی یا CI) از آن استفاده می‌شود.
// 2) در نبود آن، بیلد release با کلید دیباگ امضا می‌شود (نصب مستقیم OK، انتشار استور نه)
//    و یک هشدار واضح در لاگ بیلد چاپ می‌شود.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
def hasKeystoreFile = keystorePropertiesFile.exists()
if (hasKeystoreFile) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace = "com.qand.app"
    // compileSdk بالاتر از targetSdk اشکالی ندارد (فقط API جدید برای کامپایل)؛
    // targetSdk همان 35 می‌ماند (اندروید 15) و minSdk همان 24 (اندروید 7).
    compileSdk = 36
    ndkVersion = "25.1.8937393"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
        // لازم برای flutter_local_notifications (APIهای جدید جاوا روی اندروید قدیمی)
        coreLibraryDesugaringEnabled = true
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    defaultConfig {
        applicationId = "com.qand.app"
        // اندروید 7 (API 24) تا اندروید 15 (API 35) : min 24 ، target 35
        minSdk = 24
        targetSdk = 35
        versionCode = 1
        versionName = "1.0.0"
        multiDexEnabled = true
    }

    signingConfigs {
        if (hasKeystoreFile) {
            release {
                storeFile = file(keystoreProperties['storeFile'])
                storePassword = keystoreProperties['storePassword']
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            if (hasKeystoreFile) {
                signingConfig = signingConfigs.release
            } else {
                // هشدار: بدون keystore واقعی، با کلید دیباگ امضا می‌شود.
                println("WARNING: android/key.properties not found -> release APK will be signed with the DEBUG key (not store-ready).")
                signingConfig = signingConfigs.debug
            }
            // کوچک‌سازی و بهینه‌سازی بیلد ریلیز
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // بک‌پورت APIهای جاوا برای اندرویدهای قدیمی (minSdk همان 24 می‌ماند)
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
    // کلاس‌های Play Core که موتور فلاتر به آن‌ها ارجاع می‌دهد؛
    // بدون این وابستگی، R8 در بیلد ریلیز با خطای Missing class می‌شکند.
    implementation "com.google.android.play:core:1.10.3"
}