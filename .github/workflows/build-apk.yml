name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter --version
      # اسکافولد اندروید ناقص را کامل کن (wrapper, mipmapها). بدون --overwrite
      # تا فایل‌های سفارشی (Manifest/build.gradle/styles) دست‌نخورده بمانند.
      - name: Ensure Android scaffolding (always run to generate missing files)
        run: |
          flutter create . --org com.qand --project-name qand_app --platforms android
          # flutter create فایل قالبی test/widget_test.dart می‌سازد که به MyApp
          # ارجاع می‌دهد (وجود ندارد) و analyze/test را قرمز می‌کند — حذفش کن.
          rm -f test/widget_test.dart
          git diff --stat || true
      - run: flutter pub get
      # تست‌ها و تحلیل — دوباره فعال شد (قبلاً برای دیباگ بیلد skip شده بود و برنگشته بود)
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test --reporter expanded
      - run: flutter clean
      - name: Decode release keystore (optional)
        # فقط اگر secrets را در Settings > Secrets گذاشته باشی اجرا می‌شود؛ key.properties
        # توسط build.gradle خوانده می‌شود و در نبودش بیلد با کلید دیباگ + هشدار انجام می‌شود.
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "No release keystore secret; building with debug key."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/qand-release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/qand-release.jks"
            echo "storePassword=$KEYSTORE_PASS"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASS"
          } > android/key.properties
      - name: Restore google-services.json (optional)
        # فقط اگر secret را گذاشته باشی اجرا می‌شود؛ وگرنه بیلد بدون فایربیس
        # انجام می‌شود (اعلان محلی کار می‌کند، پوش ابری نه).
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "No google-services.json secret; building without Firebase (local notifications only)."
            exit 0
          fi
          echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > android/app/google-services.json
      # شماره بیلد از شمارنده گیت‌هاب می‌آید تا هر نسخه جدید حتماً روی
      # قبلی نصب شود (اندروید نسخه با شماره مساوی/کمتر را قبول نمی‌کند).
      - run: flutter build apk --release --build-number=${{ github.run_number }} --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
      # امضای دوباره با همان کلید، این بار با فعال کردن هر دو طرح v1 و v2.
      # AGP با minSdk=24 فقط v2 می‌سازد؛ بعضی نصب‌کننده‌های سخت‌گیر فقط
      # امضای قدیمی (JAR) را می‌پذیرند و خطای «package appears to be invalid»
      # می‌دهند. فعال کردن v1 هزینه‌ای ندارد (حدود ۱۰ کیلوبایت) و نصب را
      # روی این دستگاه‌ها قابل‌اعتمادتر می‌کند.
      - name: Re-sign with v1 + v2 enabled
        run: |
          $ANDROID_HOME/build-tools/36.0.0/zipalign -f 4 build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/aligned.apk
          $ANDROID_HOME/build-tools/36.0.0/apksigner sign \
            --ks "$RUNNER_TEMP/qand-release.jks" \
            --ks-key-alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
            --ks-pass "env:KEYSTORE_PASS" --key-pass "env:KEY_PASS" \
            --v1-signing-enabled true --v2-signing-enabled true \
            --out build/app/outputs/flutter-apk/v1v2.apk build/app/outputs/flutter-apk/aligned.apk
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose --print-certs build/app/outputs/flutter-apk/v1v2.apk | head -8
          mv build/app/outputs/flutter-apk/v1v2.apk build/app/outputs/flutter-apk/app-release.apk
        env:
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: qand-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      # ریلیز نسخه‌دار: هر push به main یک تگ متفاوت می‌گیرد تا ریلیز قبلی
      # بازنویسی نشود (قبلاً همیشه تگ latest روی هم کپی می‌شد).
      - name: Compute release tag
        id: tag
        run: echo "name=v$(date +'%Y.%m.%d')-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - run: cp build/app/outputs/flutter-apk/app-release.apk qand-app.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: "قنادی قند — ${{ steps.tag.outputs.name }}"
          body: "APK آماده نصب (اندروید ۷ تا ۱۵، هر سه معماری). بیلد خودکار از main."
          files: qand-app.apk
