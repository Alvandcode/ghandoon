name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter --version
      # اگر اسکافولد اندروید ناقص است فقط فایل‌های گمشده را بساز.
      # بدون --overwrite تا فایل‌های سفارشی (Manifest/build.gradle/styles) دست‌نخورده بمانند.
      # شرط: wrapper یا آیکون‌ها یا res نباشد (gradle.properties دستی ما نباید باعث skip شود)
      - name: Ensure Android scaffolding (missing files only)
        run: |
          # فقط اگر فایل‌های حیاتی نداریم flutter create می‌زنیم.
          # gradle/wrapper توسط flutter create ساخته می‌شود و وجود/عدم وجودش
          # معیار نباید باشد چون ما gradle.properties و res/values/styles.xml را داریم.
          if [ ! -f "android/gradlew" ] || [ ! -d "android/app/src/main/res/mipmap-hdpi" ] || [ ! -f "android/app/src/main/res/values/styles.xml" ] || [ ! -f "android/gradle.properties" ]; then
            flutter create . --org com.qand --project-name qand_app --platforms android
            git diff --stat || true
          else
            echo "Android scaffolding OK, skipping flutter create."
          fi
      - run: flutter pub get
      - run: flutter test --reporter expanded
      - name: Decode release keystore (optional)
        # فقط اگر secrets را در Settings > Secrets گذاشته باشی اجرا می‌شود، وگرنه با کلید دیباگ بیلد می‌گیرد.
        # نکته: secrets را نمی‌شود مستقیم در if گذاشت (خطای اعتبارسنجی)؛ پس همیشه اجرا
        # می‌شود ولی داخل اسکریپت اگر خالی بود skip می‌کند.
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "No release keystore secret; building with debug key."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/qand-release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/qand-release.jks"
            echo "storePassword=$KEYSTORE_PASS"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASS"
          } > android/key.properties
      - run: flutter build apk --release --verbose
      - uses: actions/upload-artifact@v4
        with:
          name: qand-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - run: cp build/app/outputs/flutter-apk/app-release.apk qand-app.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "قنادی قند - آخرین نسخه"
          body: "APK آماده نصب (اندروید 7 تا 15). بیلد خودکار از main."
          files: qand-app.apk
